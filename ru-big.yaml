rules:
  # DNS HIJACK
  - DST-PORT,53,DNS-OUT

  # Локальную сеть в директ
  - RULE-SET,geoip-private,DIRECT,no-resolve
  - RULE-SET,geosite-private,DIRECT

  # ВПН и всякие Anydesk, Rustdesk, Teamviewer в директ (опционально)
  - PROCESS-NAME-REGEX,(?i).*tailscale.*,DIRECT
  - PROCESS-NAME-REGEX,(?i).*wireguard.*,DIRECT
  - PROCESS-NAME-REGEX,(?i).*netbird.*,DIRECT
  #- PROCESS-NAME-REGEX,(?i).*anydesk.*,DIRECT
  #- PROCESS-NAME-REGEX,(?i).*rustdesk.*,DIRECT
  #- PROCESS-NAME-REGEX,(?i).*teamviewer.*,DIRECT

  # Карты и навигация напрямую (2GIS, Яндекс Карты/Навигатор)
  - PROCESS-NAME-REGEX,(?i).*(2gis|doublegis).*,DIRECT
  - PROCESS-NAME-REGEX,(?i).*(yandexmaps|yandexnavi|yandex.*map).*,DIRECT

  # Блокировка рекламы (опционально)
  - RULE-SET,oisd_big,REJECT # OISD big

  # Отправляем торренты в DIRECT (опционально)
  - RULE-SET,torrent-clients,DIRECT
  - RULE-SET,torrent-trackers,DIRECT
  - PROCESS-NAME-REGEX,(?i).*torrent.*,DIRECT

  # Российские android-приложения
  - RULE-SET,ru-apps,Без VPN

  # Делаем REJECT QUIC
  - RULE-SET,quic,REJECT

  # Свой список доменов в обход (lists/proxy.txt)
  - RULE-SET,my-proxy,Обход блокировок
  # Аниме-сайты, которые постоянно меняют домены
  - DOMAIN-REGEX,.*(yummy-?anime|anime-?portal|animedub|anidub|animelib|ikianime|anilibria).*,Обход блокировок

  # -----

  # YouTube
  - RULE-SET,youtube,YouTube
  - PROCESS-NAME-REGEX,(?i).*youtube.*,YouTube

  # Telegram
  - RULE-SET,telegram-ips,Telegram,no-resolve
  - RULE-SET,telegram-domains,Telegram
  - RULE-SET,additional-telegram-domains,Telegram
  - DOMAIN-REGEX,.*nicegram.*,Telegram
  - RULE-SET,additional-telegram-ips,Telegram,no-resolve
  - PROCESS-NAME-REGEX,(?i).*ayugram.*,Telegram
  - PROCESS-NAME-REGEX,(?i).*telegram.*,Telegram
  - PROCESS-NAME-REGEX,(?i).*nekogram.*,Telegram
  - PROCESS-NAME-REGEX,(?i).*nagram.*,Telegram
  - PROCESS-NAME-REGEX,(?i).*nekox.*,Telegram

  # Discord
  - AND,((RULE-SET,cloudflare-ips),(NETWORK,udp),(DST-PORT,19200-19500)),Discord
  - AND,((RULE-SET,cloudflare-ips),(NETWORK,udp),(DST-PORT,50000-50100)),Discord
  - AND,((RULE-SET,discord_voiceips),(NETWORK,udp),(DST-PORT,50000-50100)),Discord
  - RULE-SET,discord_domains,Discord
  - PROCESS-NAME-REGEX,(?i).*discord.*,Discord
  - PROCESS-NAME-REGEX,(?i).*vesktop.*,Discord

  # Spotify
  - PROCESS-NAME-REGEX,(?i).*spotify.*,Обход блокировок

  # agy
  - PROCESS-NAME,agy.exe,Обход блокировок

  # Обход блокировок
  - RULE-SET,ru-inside,Обход блокировок # ITDog: домены, недоступные из РФ
  - RULE-SET,refilter_domains,Обход блокировок # Re:Filter: домены, недоступные из РФ
  - RULE-SET,inline-blocked-ips,Обход блокировок,no-resolve # IP набитые вручную (смотрите выше)
  - RULE-SET,category-porn,Обход блокировок # Опционально
  - RULE-SET,ai,Обход блокировок # Нейросети
  - RULE-SET,speedtest-net,Обход блокировок # speedtest.net

  # Российские сайты
  - RULE-SET,my-direct,Без VPN # Свой список доменов напрямую (lists/direct.txt)
  - DOMAIN-REGEX,.*(avito|miradres|shutterstock|2gis|diginetica|kinescopecdn|researchgate).*,Без VPN
  - DOMAIN-REGEX,.*(kaspersky|pikabu|wildberries|aliexpress).*,Без VPN

  # geosite-ru включает в себя и собирается автоматически тут (https://github.com/Davoyan/mihomo-rule-sets) -
  # Подробнее о том, из чего формируются списки, читайте в readme https://github.com/Davoyan/mihomo-rule-sets
  - RULE-SET,geosite-ru,Без VPN

  # geo-ip-for-ru (https://github.com/Davoyan/mihomo-rule-sets/tree/main/ip-for-ru/lists)
  # Подробнее о том, из чего формируются списки, читайте в readme https://github.com/Davoyan/mihomo-rule-sets
  - RULE-SET,geoip-for-ru,Без VPN

  # По умолчанию
  - MATCH,По умолчанию

# TUN вынесен в конец файла из-за длинного списка пакетов
