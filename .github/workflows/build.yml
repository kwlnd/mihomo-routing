name: build

on:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths:
      - "lists/*.txt"
      - "scripts/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

env:
  MIHOMO_VERSION: v1.19.32

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mihomo
        run: |
          curl -fsSL "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-compatible-${MIHOMO_VERSION}.gz" | gunzip > mihomo
          sudo install -m 755 mihomo /usr/local/bin/mihomo
          rm mihomo

      # Прошлая сборка нужна, чтобы при сбое источника остался старый файл
      - name: Restore previous build
        run: |
          mkdir out
          if git fetch --depth=1 origin release; then
            git archive FETCH_HEAD | tar -x -C out
            echo "OLD_TREE=$(git rev-parse 'FETCH_HEAD^{tree}')" >> "$GITHUB_ENV"
          fi

      - name: Build lists
        id: build
        continue-on-error: true
        run: bash scripts/build.sh

      # Ветка release каждый раз перезаписывается одним коммитом, чтобы репозиторий не рос
      - name: Publish to release branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd out
          git init -q -b release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Lists $(date -u +%F)"
          if [ "$(git rev-parse 'HEAD^{tree}')" = "${OLD_TREE:-}" ]; then
            echo "No changes"
          else
            git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" release
          fi

      - name: Sync package list in config
        run: |
          python3 scripts/sync-packages.py ru-big.yaml out/rules/ru-apps.yaml
          if git diff --quiet ru-big.yaml; then
            echo "No changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -q -m "Update package list" ru-big.yaml
            git pull --rebase
            git push
          fi

      - name: Fail if a list was not built
        if: steps.build.outcome == 'failure'
        run: exit 1
